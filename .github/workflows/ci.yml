name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: .NET 10 · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/MotorValley.sln

      - name: Build
        run: dotnet build backend/MotorValley.sln -c Release --no-restore

      - name: Test
        run: dotnet test backend/MotorValley.sln -c Release --no-build --verbosity normal

  python:
    name: Python · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The processor/producer modules are imported by the tests, so their
          # runtime deps must be present for collection to succeed.
          pip install -r processor/requirements.txt
          pip install -r producer/requirements.txt
          pip install -r tests/python/requirements.txt

      - name: Run tests
        run: pytest tests/python -v

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  infra:
    name: Bicep · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep template
        uses: azure/CLI@v2
        with:
          inlineScript: az bicep build --file deploy/azure/main.bicep
